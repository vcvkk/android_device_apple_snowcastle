name: Build kernel & m1n1 for iPhone X (snowcastle)

# Runs on the free GitHub-hosted ubuntu-latest runner.
# Produces:
#   - kernel artifact: Image.gz + Apple DTB files
#   - m1n1 artifact: m1n1-boot.bin + m1n1-recovery.bin
#     (only when a release tag with prebuilt ramdisks is specified)
#
# First run: leave ramdisk_release_tag empty — you get the kernel.
# After you have ramdisk.img / ramdisk-recovery.img from a full build,
# upload them to a GitHub Release and pass that tag on the next run.

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: 'LineageOS branch (used to fetch kernel config fragments)'
        required: true
        default: 'lineage-23.2'
        type: string
      llvm_version:
        description: 'LLVM version for kernel compilation (from github.com/llvm/llvm-project/releases)'
        required: true
        default: '19.1.7'
        type: string
      ramdisk_release_tag:
        description: 'GitHub Release tag that contains ramdisk.img + ramdisk-recovery.img (leave empty to skip m1n1 assembly)'
        required: false
        default: ''
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          echo "=== Disk space before ==="
          df -h
          # Remove large pre-installed packages (~20 GB freed)
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/share/swift
          sudo apt-get remove -y \
            azure-cli google-chrome-stable firefox \
            microsoft-edge-stable mono-complete \
            powershell || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo "=== Disk space after ==="
          df -h

      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex git \
            libelf-dev libssl-dev python3 rsync

      - name: Setup repo tool
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync kernel config fragments from LineageOS
        run: |
          mkdir -p /tmp/lineage-sync
          cd /tmp/lineage-sync
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b ${{ inputs.lineage_branch }} \
            --depth=1 \
            --no-clone-bundle \
            -q
          # Sync only the small config-only repos (a few MB each)
          repo sync \
            kernel/mainline/configs \
            kernel/configs \
            --no-clone-bundle --no-tags -c -q -j4
          echo "MAINLINE_CONFIGS=/tmp/lineage-sync/kernel/mainline/configs" >> "$GITHUB_ENV"
          echo "KERNEL_CONFIGS=/tmp/lineage-sync/kernel/configs"            >> "$GITHUB_ENV"

      - name: Clone HoolockLinux kernel source
        run: |
          git clone --depth=1 \
            https://github.com/HoolockLinux/linux \
            kernel/apple/HoolockLinux

      - name: Download LLVM toolchain
        run: |
          LLVM_VERSION="${{ inputs.llvm_version }}"
          LLVM_ARCHIVE="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_ARCHIVE}"
          echo "Downloading LLVM ${LLVM_VERSION}..."
          curl -fL --retry 3 --retry-delay 5 -o /tmp/llvm.tar.xz "$LLVM_URL"
          sudo tar -xJf /tmp/llvm.tar.xz -C /opt/
          sudo mv "/opt/LLVM-${LLVM_VERSION}-Linux-X64" /opt/llvm
          rm -f /tmp/llvm.tar.xz
          echo "/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "=== Disk space after LLVM download ==="
          df -h

      - name: Merge kernel config fragments
        run: |
          DEVICE_PATH="${{ github.workspace }}"
          MAINLINE_CONFIGS="${{ env.MAINLINE_CONFIGS }}"
          KERNEL_CONFIGS="${{ env.KERNEL_CONFIGS }}"
          KDIR="kernel/apple/HoolockLinux"

          # Ordered list of config fragments — same order as BoardConfig.mk
          # Non-existing fragments are silently skipped
          FRAGMENTS=(
            "$DEVICE_PATH/configs/kernel/config-postmarketos-apple-4k.aarch64"
            "$DEVICE_PATH/configs/kernel/apple.config"
            "$MAINLINE_CONFIGS/fragments/android-base-pre/common.config"
            "$MAINLINE_CONFIGS/fragments/android-base-pre/arm64.config"
            "$KERNEL_CONFIGS/b/android-6.12/android-base.config"
            "$MAINLINE_CONFIGS/fragments/android-base-conditional/CONFIG_ARM64-y.config"
            "$MAINLINE_CONFIGS/fragments/common.config"
            "$MAINLINE_CONFIGS/fragments/y/arm64/pagesize-16k.config"
            "$MAINLINE_CONFIGS/fragments/y/fbcon.config"
            "$MAINLINE_CONFIGS/fragments/n/disable-clang-hardening-features.config"
            "$MAINLINE_CONFIGS/fragments/n/faster-build-time.config"
          )

          AVAILABLE=()
          for f in "${FRAGMENTS[@]}"; do
            if [ -f "$f" ]; then
              AVAILABLE+=("$f")
            else
              echo "Skipping missing fragment: $f"
            fi
          done

          echo "Merging ${#AVAILABLE[@]} config fragment(s)..."
          cd "$KDIR"
          # Use the first fragment as the base config, merge the rest on top
          cp "${AVAILABLE[0]}" arch/arm64/configs/snowcastle_defconfig
          if [ ${#AVAILABLE[@]} -gt 1 ]; then
            scripts/kconfig/merge_config.sh \
              -m arch/arm64/configs/snowcastle_defconfig \
              "${AVAILABLE[@]:1}"
            mv .config arch/arm64/configs/snowcastle_defconfig
          fi

      - name: Build kernel
        run: |
          cd kernel/apple/HoolockLinux
          MAKE_ARGS=(
            ARCH=arm64
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
          )
          make "${MAKE_ARGS[@]}" snowcastle_defconfig
          make "${MAKE_ARGS[@]}" -j$(nproc) Image.gz dtbs modules
          echo "=== Kernel build complete ==="
          ls -lh arch/arm64/boot/Image.gz
          echo "DTB files:"
          find arch/arm64/boot/dts/apple/ -name '*.dtb' | sort

      - name: Download prebuilt ramdisks from GitHub Release
        if: inputs.ramdisk_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ramdisks
          gh release download "${{ inputs.ramdisk_release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "ramdisk.img" \
            --pattern "ramdisk-recovery.img" \
            --dir /tmp/ramdisks/
          echo "Downloaded ramdisks:"
          ls -lh /tmp/ramdisks/

      - name: Assemble m1n1-boot.bin and m1n1-recovery.bin
        if: inputs.ramdisk_release_tag != ''
        run: |
          KERNEL="kernel/apple/HoolockLinux/arch/arm64/boot/Image.gz"
          M1N1="prebuilts/m1n1.bin"

          # Collect DTB files in sorted order (same as m1n1.mk: find ... -type f -name '*.dtb')
          mapfile -t DTBS < <(find kernel/apple/HoolockLinux/arch/arm64/boot/dts/apple/ \
                               -type f -name '*.dtb' 2>/dev/null | sort)

          if [ ${#DTBS[@]} -eq 0 ]; then
            echo "Warning: no DTB files found under dts/apple/"
          fi

          # Boot args matching BoardConfig.mk (normal partition scheme)
          # MAINLINE_COMMON_* values are not set here; add them via repo if needed
          COMMON="androidboot.hardware=snowcastle androidboot.serialno=snowcastle"
          COMMON="$COMMON androidboot.verifiedbootstate=orange console=tty0"

          BOOT_ARGS="$COMMON androidboot.fstab_suffix=normal"
          BOOT_ARGS="$BOOT_ARGS androidboot.init_fatal_pause=true"
          BOOT_ARGS="$BOOT_ARGS androidboot.mount_firmware=false"
          BOOT_ARGS="$BOOT_ARGS rdinit=/system/bin/generic_init"
          BOOT_ARGS="$BOOT_ARGS sysctl.kernel.firmware_config.force_sysfs_fallback=1"

          RECOVERY_ARGS="$COMMON androidboot.fstab_suffix=normal quiet"

          # Replicate the exact cat command from build/tasks/m1n1.mk
          cat "$M1N1" \
            <(echo "chosen.bootargs=$BOOT_ARGS") \
            "${DTBS[@]}" \
            "$KERNEL" \
            /tmp/ramdisks/ramdisk.img \
            > /tmp/m1n1-boot.bin

          cat "$M1N1" \
            <(echo "chosen.bootargs=$RECOVERY_ARGS") \
            "${DTBS[@]}" \
            "$KERNEL" \
            /tmp/ramdisks/ramdisk-recovery.img \
            > /tmp/m1n1-recovery.bin

          echo "=== m1n1 images ==="
          ls -lh /tmp/m1n1-boot.bin /tmp/m1n1-recovery.bin

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: |
            kernel/apple/HoolockLinux/arch/arm64/boot/Image.gz
            kernel/apple/HoolockLinux/arch/arm64/boot/dts/apple/
          if-no-files-found: error
          retention-days: 14

      - name: Upload m1n1 artifacts
        if: inputs.ramdisk_release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: m1n1-${{ github.run_number }}
          path: /tmp/m1n1-*.bin
          if-no-files-found: error
          retention-days: 14

      - name: Print disk usage summary
        if: always()
        run: df -h
